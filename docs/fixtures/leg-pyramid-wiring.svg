<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1200" viewBox="0 0 1200 1200" font-family="Helvetica, Arial, sans-serif" font-size="15">
  <defs>
    <g id="gnd"><line x1="0" y1="0" x2="0" y2="8" stroke="#000" stroke-width="2"/><line x1="-9" y1="8" x2="9" y2="8" stroke="#000" stroke-width="2.5"/><line x1="-5.5" y1="12" x2="5.5" y2="12" stroke="#000" stroke-width="2"/><line x1="-2" y1="16" x2="2" y2="16" stroke="#000" stroke-width="2"/></g>
  </defs>
  <rect width="1200" height="1200" fill="#fff"/>
  <text x="600" y="40" text-anchor="middle" font-size="24" font-weight="bold">Leg pyramid: ESP32 → SN74AHCT125 → four WS2815 legs</text>
  <text x="600" y="66" text-anchor="middle" font-size="14" fill="#555">3.3 V data in, 5 V data out. Every ⏚ symbol is the same common ground.</text>

  <!-- Rails -->
  <line x1="60" y1="120" x2="1140" y2="120" stroke="#c00" stroke-width="4"/>
  <text x="250" y="112" fill="#c00" font-weight="bold">+12 V (pyramid supply)</text>
  <line x1="60" y1="170" x2="1140" y2="170" stroke="#e07000" stroke-width="4"/>
  <text x="250" y="162" fill="#e07000" font-weight="bold">+5 V (from the BEC)</text>

  <!-- BEC -->
  <rect x="70" y="195" width="150" height="60" rx="8" fill="#fff4e0" stroke="#b07000" stroke-width="2"/>
  <text x="145" y="221" text-anchor="middle" font-weight="bold">BEC</text>
  <text x="145" y="241" text-anchor="middle" font-size="12">12 V → 5 V, − to ⏚</text>
  <line x1="100" y1="120" x2="100" y2="195" stroke="#c00" stroke-width="3"/>
  <line x1="190" y1="170" x2="190" y2="195" stroke="#e07000" stroke-width="3"/>

  <!-- ESP32 -->
  <rect x="70" y="300" width="245" height="600" rx="12" fill="#e8f0ff" stroke="#2050a0" stroke-width="2"/>
  <text x="185" y="395" text-anchor="middle" font-weight="bold" font-size="19">ESP32</text>
  <text x="185" y="415" text-anchor="middle" font-weight="bold" font-size="19">dev board</text>
  <text x="185" y="437" text-anchor="middle" font-size="12">rave-pyramid-l / -r (WLED)</text>
  <g>
    <circle cx="315" cy="330" r="5" fill="#2050a0"/><text x="303" y="335" text-anchor="end">5V</text>
    <circle cx="315" cy="470" r="5" fill="#2050a0"/><text x="303" y="475" text-anchor="end">GPIO 18</text>
    <circle cx="315" cy="500" r="5" fill="#2050a0"/><text x="303" y="505" text-anchor="end">GPIO 19</text>
    <circle cx="315" cy="560" r="5" fill="#2050a0"/><text x="303" y="565" text-anchor="end">GPIO 25</text>
    <circle cx="315" cy="690" r="5" fill="#2050a0"/><text x="303" y="695" text-anchor="end">GPIO 26</text>
    <circle cx="315" cy="800" r="5" fill="#2050a0"/><text x="303" y="805" text-anchor="end">GPIO 27</text>
    <circle cx="315" cy="860" r="5" fill="#2050a0"/><text x="303" y="865" text-anchor="end">GND</text>
  </g>
  <polyline points="320,330 335,330 335,170" fill="none" stroke="#e07000" stroke-width="3"/>
  <polyline points="320,860 340,860" fill="none" stroke="#000" stroke-width="2"/><use href="#gnd" x="340" y="860"/>

  <!-- Chip: left pins y = 470 + (n-1)*55 -->
  <rect x="480" y="440" width="200" height="390" rx="6" fill="#222" stroke="#000" stroke-width="2"/>
  <path d="M565,440 A15,15 0 0 0 595,440" fill="#fff"/>
  <circle cx="497" cy="455" r="4" fill="#888"/>
  <g font-size="13" fill="#fff">
    <text x="492" y="475">1 1OE</text><text x="492" y="530">2 1A</text><text x="492" y="585">3 1Y</text>
    <text x="492" y="640">4 2OE</text><text x="492" y="695">5 2A</text><text x="492" y="750">6 2Y</text><text x="492" y="805">7 GND</text>
    <text x="668" y="475" text-anchor="end">VCC 14</text><text x="668" y="530" text-anchor="end">4OE 13</text><text x="668" y="585" text-anchor="end">4A 12</text>
    <text x="668" y="640" text-anchor="end">4Y 11</text><text x="668" y="695" text-anchor="end">3OE 10</text><text x="668" y="750" text-anchor="end">3A 9</text><text x="668" y="805" text-anchor="end">3Y 8</text>
  </g>
  <text x="580" y="855" text-anchor="middle" font-weight="bold">SN74AHCT125N</text>
  <text x="580" y="873" text-anchor="middle" font-size="12" fill="#555">pin 1 next to the notch / dot</text>
  <g stroke="#666" stroke-width="5">
    <line x1="466" y1="470" x2="480" y2="470"/><line x1="466" y1="525" x2="480" y2="525"/><line x1="466" y1="580" x2="480" y2="580"/>
    <line x1="466" y1="635" x2="480" y2="635"/><line x1="466" y1="690" x2="480" y2="690"/><line x1="466" y1="745" x2="480" y2="745"/><line x1="466" y1="800" x2="480" y2="800"/>
    <line x1="680" y1="470" x2="694" y2="470"/><line x1="680" y1="525" x2="694" y2="525"/><line x1="680" y1="580" x2="694" y2="580"/>
    <line x1="680" y1="635" x2="694" y2="635"/><line x1="680" y1="690" x2="694" y2="690"/><line x1="680" y1="745" x2="694" y2="745"/><line x1="680" y1="800" x2="694" y2="800"/>
  </g>

  <!-- Grounds on the chip: OE 1, 4, 10, 13 and GND 7 -->
  <polyline points="466,470 458,470" stroke="#000" stroke-width="2"/><use href="#gnd" x="458" y="470"/>
  <polyline points="466,635 458,635" stroke="#000" stroke-width="2"/><use href="#gnd" x="458" y="635"/>
  <polyline points="466,800 458,800" stroke="#000" stroke-width="2"/><use href="#gnd" x="458" y="800"/>
  <polyline points="694,525 702,525" stroke="#000" stroke-width="2"/><use href="#gnd" x="702" y="525"/>
  <polyline points="694,690 702,690" stroke="#000" stroke-width="2"/><use href="#gnd" x="702" y="690"/>

  <!-- VCC pin 14 up to 5 V, with the 100 nF cap -->
  <polyline points="694,470 715,470 715,170" fill="none" stroke="#e07000" stroke-width="3"/>
  <line x1="715" y1="260" x2="760" y2="260" stroke="#e07000" stroke-width="2"/>
  <line x1="760" y1="248" x2="760" y2="272" stroke="#000" stroke-width="3"/><line x1="768" y1="248" x2="768" y2="272" stroke="#000" stroke-width="3"/>
  <line x1="768" y1="260" x2="790" y2="260" stroke="#000" stroke-width="2"/><use href="#gnd" x="790" y="260"/>
  <text x="764" y="240" text-anchor="middle" font-size="12">100 nF (optional, right at pins 14 + 7)</text>

  <!-- Inputs (blue). 25 and 26 go over the top to the right-hand side -->
  <polyline points="320,470 350,470 350,390 800,390 800,745 694,745" fill="none" stroke="#2050a0" stroke-width="3"/>
  <polyline points="320,500 365,500 365,410 775,410 775,580 694,580" fill="none" stroke="#2050a0" stroke-width="3"/>
  <text x="560" y="383" text-anchor="middle" font-size="12" fill="#2050a0">GPIO 18 → 3A (pin 9)</text>
  <text x="560" y="427" text-anchor="middle" font-size="12" fill="#2050a0">GPIO 19 → 4A (pin 12)</text>
  <polyline points="320,560 400,560 400,525 466,525" fill="none" stroke="#2050a0" stroke-width="3"/>
  <polyline points="320,690 466,690" fill="none" stroke="#2050a0" stroke-width="3"/>

  <!-- Outputs (green) -->
  <!-- 4Y pin 11 → back-left -->
  <line x1="694" y1="635" x2="880" y2="635" stroke="#080" stroke-width="3"/>
  <!-- 3Y pin 8 → back-right -->
  <line x1="694" y1="800" x2="880" y2="800" stroke="#080" stroke-width="3"/>
  <!-- 1Y pin 3: out left, hop over the GPIO 22 wire, under the chip → front-left -->
  <path d="M466,580 H425 V680 A10,10 0 0 0 425,700 V990 H880" fill="none" stroke="#080" stroke-width="3"/>
  <!-- 2Y pin 6 → front-right -->
  <path d="M466,745 H445 V930 H880" fill="none" stroke="#080" stroke-width="3"/>

  <!-- Resistors + legs -->
  <g font-size="12">
    <rect x="880" y="623" width="60" height="24" fill="#fff" stroke="#000" stroke-width="2"/><text x="910" y="640" text-anchor="middle">330 Ω</text>
    <rect x="880" y="788" width="60" height="24" fill="#fff" stroke="#000" stroke-width="2"/><text x="910" y="805" text-anchor="middle">330 Ω</text>
    <rect x="880" y="918" width="60" height="24" fill="#fff" stroke="#000" stroke-width="2"/><text x="910" y="935" text-anchor="middle">330 Ω</text>
    <rect x="880" y="978" width="60" height="24" fill="#fff" stroke="#000" stroke-width="2"/><text x="910" y="995" text-anchor="middle">330 Ω</text>
  </g>
  <g stroke="#080" stroke-width="3">
    <line x1="940" y1="635" x2="975" y2="635"/><line x1="940" y1="800" x2="975" y2="800"/>
    <line x1="940" y1="930" x2="975" y2="930"/><line x1="940" y1="990" x2="975" y2="990"/>
  </g>
  <g font-size="13">
    <rect x="975" y="612" width="165" height="46" rx="6" fill="#efe" stroke="#080" stroke-width="2"/>
    <text x="1057" y="632" text-anchor="middle" font-weight="bold">Front-right leg DI</text><text x="1057" y="650" text-anchor="middle" font-size="11">GPIO 19 · 4A → 4Y</text>
    <rect x="975" y="777" width="165" height="46" rx="6" fill="#efe" stroke="#080" stroke-width="2"/>
    <text x="1057" y="797" text-anchor="middle" font-weight="bold">Front-left leg DI</text><text x="1057" y="815" text-anchor="middle" font-size="11">GPIO 18 · 3A → 3Y</text>
    <rect x="975" y="907" width="165" height="46" rx="6" fill="#efe" stroke="#080" stroke-width="2"/>
    <text x="1057" y="927" text-anchor="middle" font-weight="bold">Back-left leg DI</text><text x="1057" y="945" text-anchor="middle" font-size="11">GPIO 26 · 2A → 2Y</text>
    <rect x="975" y="967" width="165" height="46" rx="6" fill="#efe" stroke="#080" stroke-width="2"/>
    <text x="1057" y="987" text-anchor="middle" font-weight="bold">Back-right leg DI</text><text x="1057" y="1005" text-anchor="middle" font-size="11">GPIO 25 · 1A → 1Y</text>
  </g>
  <rect x="930" y="195" width="210" height="110" rx="8" fill="#f6fff6" stroke="#080"/>
  <text x="1035" y="218" text-anchor="middle" font-size="13" font-weight="bold">Each strip, at the apex:</text>
  <text x="1035" y="240" text-anchor="middle" font-size="12">+12 V → 12 V rail</text>
  <text x="1035" y="258" text-anchor="middle" font-size="12">GND → ⏚</text>
  <text x="1035" y="276" text-anchor="middle" font-size="12">BI → ⏚</text>
  <text x="1035" y="294" text-anchor="middle" font-size="12">DI → its 330 Ω (green)</text>

  <!-- Laser -->
  <polyline points="320,800 380,800 380,940" fill="none" stroke="#2050a0" stroke-width="2" stroke-dasharray="6,4"/>
  <text x="80" y="960" font-size="13">GPIO 27 → laser through a 2N2222</text>
  <text x="80" y="978" font-size="13">(as on the C3; not through this chip)</text>

  <!-- Legend -->
  <rect x="60" y="1060" width="1080" height="110" rx="8" fill="#f6f6f6" stroke="#bbb"/>
  <text x="80" y="1088" font-size="14"><tspan fill="#2050a0" font-weight="bold">Blue</tspan> 3.3 V data in    <tspan fill="#080" font-weight="bold">Green</tspan> 5 V data out    <tspan fill="#e07000" font-weight="bold">Orange</tspan> 5 V    <tspan fill="#c00" font-weight="bold">Red</tspan> 12 V    ⏚ common ground (12 V −, BEC −, ESP32, chip, strips)</text>
  <text x="80" y="1114" font-size="14">Crossing wires don't connect; a dot or a hop is drawn where it matters. Chip VCC is 5 V, never 3.3 V or 12 V.</text>
  <text x="80" y="1140" font-size="14"><tspan font-weight="bold">One-leg test first:</tspan> wire GPIO 25 → pin 2 and pin 3 → 330 Ω → back-right DI only.</text>
  <text x="80" y="1160" font-size="14">Until the other legs go on, tie the unused inputs (pins 5, 9 and 12) to ⏚.</text>
</svg>
