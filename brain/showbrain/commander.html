<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>Sektor5 · Commander</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCA2NCA2NCI+PHJlY3Qgd2lkdGg9IjY0IiBoZWlnaHQ9IjY0IiByeD0iMTIiIGZpbGw9IiMyNDI0MjQiLz48cGF0aCB0cmFuc2Zvcm09InRyYW5zbGF0ZSgxNC41IDcpIHNjYWxlKC41KSIgZD0iTTAsMCBMNzAsMCBMNzAsMjEgTDIxLDIxIEwyMSw0MCBMNTcsNDAgTDcwLDUzIEw3MCw4NyBMNTcsMTAwIEwwLDEwMCBMMCw3OSBMNDksNzkgTDQ5LDYxIEwwLDYxIFoiIGZpbGw9IiNGRjVBMUYiLz48L3N2Zz4=">
<style>
  :root { --bg:var(--n07070c, #07070c); --panel:#12131d; --line:#262a3d; --text:#e8e9f3; --dim:var(--na1a1a1, #a1a1a1); --pink:#ff2fd0; --cyan:#2fe6ff; --good:#3dff8b; --warn:#ffb02e; --violet:#9b8cff; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  body { margin:0; background:var(--bg); color:var(--text); font:15px/1.4 system-ui,-apple-system,sans-serif; padding:14px; -webkit-user-select:none; user-select:none; }
  h1 { font-size:14px; letter-spacing:.2em; margin:0 0 12px; display:flex; gap:12px; align-items:baseline; } h1 b { color:var(--pink); }
  h1 .keys { margin-left:auto; font-size:11px; letter-spacing:.04em; color:var(--dim); font-weight:500; }
  h2 { font-size:11px; letter-spacing:.16em; text-transform:uppercase; color:var(--dim); margin:0 0 10px; }
  .wrap { display:grid; gap:12px; grid-template-columns:repeat(auto-fit, minmax(320px, 1fr)); align-items:start; }
  .scene { font-size:44px; font-weight:900; letter-spacing:.04em; line-height:1; }
  .scene.BUILD, .scene.HOLD { color:var(--warn); } .scene.DROP { color:var(--pink); } .scene.PREDROP { color:#fff; }
  .scene.GROOVE { color:var(--cyan); } .scene.BREAKDOWN { color:var(--violet); }
  .card { background:var(--panel); border:1px solid var(--line); border-radius:16px; padding:14px; }
  .card.span { grid-column:1 / -1; }
  .row { display:flex; gap:10px; flex-wrap:wrap; align-items:baseline; }
  .dim { color:var(--dim); font-size:13px; }
  .tag { font-size:11px; font-weight:800; letter-spacing:.08em; padding:2px 8px; border-radius:6px; background:var(--warn); color:#000; }
  .count { font-size:28px; font-weight:800; color:var(--warn); font-variant-numeric:tabular-nums; }
  .bar { height:10px; background:#1d2031; border-radius:6px; overflow:hidden; margin-top:8px; }
  .bar div { height:100%; background:linear-gradient(90deg,var(--warn),#fff); width:0; }
  .beats { display:grid; grid-template-columns:repeat(4,1fr); gap:6px; margin-top:10px; }
  .beats div { height:10px; border-radius:4px; background:#1d2031; }
  .beats div.on { background:var(--pink); box-shadow:0 0 12px var(--pink); } .beats div.on.one { background:var(--cyan); box-shadow:0 0 12px var(--cyan); }
  #viz { width:100%; height:22px; display:block; margin-top:12px; }
  .grid { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  .grid4 { display:grid; grid-template-columns:repeat(4,1fr); gap:8px; }
  .grid5 { display:grid; grid-template-columns:repeat(auto-fill, minmax(86px, 1fr)); gap:8px; }
  button { font:inherit; font-weight:800; letter-spacing:.06em; padding:18px 10px; border-radius:14px; border:1px solid var(--line); background:#1b1e2e; color:var(--text); touch-action:manipulation; }
  button small { display:block; font-size:10px; font-weight:600; color:var(--dim); letter-spacing:.04em; margin-top:2px; }
  button:active, button.held { transform:scale(.97); }
  button.big { background:var(--pink); color:#000; border-color:var(--pink); font-size:18px; }
  button.big small, button.on small, button.held small { color:rgba(0,0,0,.6); }
  button.on { background:var(--cyan); color:#000; border-color:var(--cyan); }
  .pad { padding:26px 6px; font-size:15px; }
  .pad.held { background:#fff; color:#000; border-color:#fff; box-shadow:0 0 24px rgba(var(--inv, 255,255,255),.5); }
  .pad.look.on { background:var(--c, var(--cyan)); border-color:var(--c, var(--cyan)); box-shadow:0 0 18px var(--c, var(--cyan)); }
  .seg { display:flex; gap:6px; } .seg button { flex:1; padding:12px 6px; }
  .swatches { display:grid; grid-template-columns:repeat(6,1fr); gap:8px; margin-top:10px; }
  .swatches button { padding:0; height:40px; border-radius:10px; border:2px solid transparent; }
  .swatches button.on { border-color:#fff; box-shadow:0 0 14px rgba(var(--inv, 255,255,255),.4); }
  input[type=range] { width:100%; accent-color:var(--cyan); }
  label { display:block; margin:12px 0 4px; color:var(--dim); font-size:13px; }
  .fx { display:grid; grid-template-columns:auto 1fr 44px; gap:10px; align-items:center; margin-top:8px; }
  .fx button { padding:10px 12px; min-width:92px; }
  .fx .lv { text-align:right; font-variant-numeric:tabular-nums; color:var(--dim); font-size:13px; }
  .tapbpm { font-size:34px; font-weight:900; font-variant-numeric:tabular-nums; text-align:center; }

  /* ------------------------------------------------------------------ design system
     Near-black, hairline grid, one orange accent, system type (the shared theme in s5auth.js sits on top: docs/design.md).
     Same tokens and bottom tiles as the dashboard, Commander, mapping and visuals pages. */
  :root { --bg:var(--n0c0c0e, #0c0c0e); --panel:var(--n131315, #131315); --card:var(--n131315, #131315); --line:var(--n262628, #262628); --line2:var(--n3a3a3c, #3a3a3c); --text:var(--nfafafa, #fafafa); --dim:var(--na1a1a1, #a1a1a1);
          --accent:#ff5a1f; --good:#7ccf8a; --warn:#f2b84b; --bad:#ef5b5b; --well:var(--n08080a, #08080a);
          --pink:#ff5a1f; --cyan:#ff5a1f; --acc:#ff5a1f; --violet:var(--nc4c4c4, #c4c4c4);
          --font:"Inter", -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, system-ui, sans-serif; }
  html, body { background: var(--bg); }
  body { font-family: var(--font); letter-spacing: .01em; }
  button, input, select { font-family: var(--font); border-radius: 0 !important; }
  button { background: transparent; border: 1px solid var(--line2); color: var(--text); font-weight: 600; letter-spacing: .08em; }
  button:hover { border-color: var(--accent); }
  button.on { background: var(--accent); border-color: var(--accent); color: #fff; }
  select, input[type=text], input:not([type]) { background: var(--well); border: 1px solid var(--line2); color: var(--text); }
  input[type=range] { accent-color: var(--accent); }
  .card { border-radius: 0; background: var(--panel); border: 1px solid var(--line); box-shadow: none; }
  .card h2, .card h3 { font-weight: 500; letter-spacing: .16em; color: var(--dim); }
  .pill { border-radius: 0 !important; background: transparent !important; border: 1px solid var(--line2); color: var(--dim);
          font-weight: 600; font-size: 11px; letter-spacing: .12em; }
  .pill.ok { color: var(--good) !important; border-color: var(--good) !important; }
  a { color: var(--accent); }
  nav.apps { display: grid; grid-template-columns: repeat(4, 1fr); border-top: 1px solid var(--line); margin-top: 24px; }
  nav.apps a { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 28px 30px; color: var(--dim);
               text-decoration: none; font-size: 17px; font-weight: 400; line-height: 1.3; border-left: 1px solid var(--line); }
  nav.apps a:first-child { border-left: 0; }
  nav.apps a:hover { color: var(--text); background: var(--n171719, #171719); }
  nav.apps a .arr { font-size: 26px; font-weight: 300; color: var(--text); }
  nav.apps a small { display: block; font-size: 11px; letter-spacing: .16em; color: var(--n525254, #525254); margin-bottom: 4px; }
  nav.apps a.here { background: var(--text); color: var(--n0a0a0c, #0a0a0c); }
  nav.apps a.here small { color: var(--n646464, #646464); }
  nav.apps a.here .arr { background: var(--accent); color: #fff; align-self: stretch; display: grid; place-items: center; width: 80px; margin: -28px -30px -28px 0; }
  @media (max-width: 900px) { nav.apps { grid-template-columns: 1fr 1fr; } nav.apps a:nth-child(3) { border-left: 0; } }

  body { padding: 0; font-size: 15px; }
  h1 { font-weight: 600; font-size: 14px; letter-spacing: .22em; margin: 0; padding: 0 24px; min-height: 64px; align-items: stretch; gap: 20px; border-bottom: 1px solid var(--line); }
  h1 > b, h1 .keys { align-self: center; }
  h1 b { color: var(--accent); font-weight: 600; }
  .wrap { gap: 0; padding: 0; counter-reset: sec; }
  .wrap > .card { border: 0; border-right: 1px solid var(--line); border-bottom: 1px solid var(--line); padding: 22px 24px; }
  .card h2 { counter-increment: sec; font-size: 12px; }
  .card h2::before { content: counter(sec, decimal-leading-zero) "  —  "; color: var(--accent); }
  .scene { font-weight: 300; font-size: 56px; letter-spacing: .01em; }
  @media (max-width: 760px) { .scene { font-size: clamp(30px, 11vw, 56px); } }
  .scene.GROOVE { color: var(--text); } .scene.BREAKDOWN { color: var(--nc4c4c4, #c4c4c4); } .scene.DROP { color: var(--accent); }
  .tag { border-radius: 0; background: transparent; color: var(--warn); border: 1px solid var(--warn); font-weight: 600; }
  .count { font-weight: 300; font-size: 34px; color: var(--accent); }
  .bar { border-radius: 0; background: var(--well); height: 6px; }
  .bar div { background: var(--accent); }
  .beats { gap: 4px; } .beats div { border-radius: 0; background: var(--well); }
  .beats div.on { background: var(--text); box-shadow: none; } .beats div.on.one { background: var(--accent); box-shadow: none; }
  button { padding: 16px 10px; }
  button small { font-weight: 500; color: var(--n686868, #686868); }
  button.big { background: var(--accent); color: #fff; border-color: var(--accent); font-weight: 600; }
  button.big small, button.on small, button.held small { color: rgba(var(--inv, 255,255,255),.75); }
  .pad { padding: 26px 6px; }
  .pad.held { background: var(--text); color: var(--n0a0a0c, #0a0a0c); border-color: var(--text); box-shadow: none; }
  .pad.look.on { background: var(--accent); border-color: var(--accent); color: #fff; box-shadow: none; }
  .swatches button { border-radius: 0 !important; border-width: 2px; }
  .swatches button.on { border-color: var(--text); box-shadow: none; }
  .tapbpm { font-weight: 300; font-size: 44px; }
  /* Page links in the top bar (Decks / Lighting / Projection / Visuals): the current one underlined. */
  nav.pages { display: flex; gap: 2px; align-self: stretch; }
  nav.pages a { display: flex; align-items: center; padding: 0 12px; color: var(--dim); text-decoration: none; font-size: 14px; font-weight: 500;
                letter-spacing: .01em; text-transform: none; border-bottom: 3px solid transparent; border-top: 3px solid transparent; }
  nav.pages a:hover { color: var(--text); }
  nav.pages a.here { color: var(--text); border-bottom-color: var(--accent); }
  .s5logo { display: inline-flex; align-items: center; vertical-align: middle; line-height: 1; }
  .s5logo .s5word { color: var(--text, #fafafa); flex: none; display: block; }
  .s5logo .s5five { fill: var(--accent, #ff5a1f); }
  /* Lighting like the other pages: the live status (scene, drop countdown, bars, fixtures) is the
     display, pinned under the top bar; tabs under it pick one section of controls. */
  .wrap.tabbed { grid-template-columns: minmax(0, 1fr); }
  .wrap.tabbed > .card.span { position: sticky; top: var(--s5bar, 48px); z-index: 30; padding-bottom: 0; background: var(--bg); border: 0; border-bottom: 1px solid var(--line); }   /* the display: page background, like every page's */
  .wrap.tabbed > .card.span > .s5sect { margin: 16px -24px 0; }
  .wrap.tabbed > .card:not(.span) { width: 100%; max-width: 860px; justify-self: center; }
  .wrap.tabbed > .card:not(.span) > h2:first-child { display: none; }   /* the tab says which section this is */
  .wrap.tabbed .card h2::before { content: none; }
  /* Keyboard shortcuts: a small map at the bottom of Performance (not in the top bar). Hidden on touch screens. */
  .keymap { display: flex; flex-wrap: wrap; gap: 6px 14px; margin-top: 18px; padding-top: 14px; border-top: 1px solid var(--line); font-size: 12px; color: var(--dim); }
  .keymap kbd { font: 600 11px/1 var(--font); color: var(--text); border: 1px solid var(--line2); padding: 3px 6px; margin-right: 3px; }
  @media (pointer: coarse) { .keymap { display: none; } }
  /* Phones: the pinned status kept compact (about a third of the screen), the controls scroll under it. */
  @media (max-width: 760px) {
    .wrap.tabbed > .card.span { padding: 12px 14px 0; }
    .scene { font-size: clamp(28px, 9vw, 40px) !important; } .count { font-size: 20px !important; }
    #title, #pos { font-size: 12px; } #viz { margin-top: 8px; }
    .wrap.tabbed > .card.span > .s5sect { margin: 10px -14px 0; }
  }
</style>
<script src="/s5auth.js"></script>
</head>
<body>
<h1 class="s5bar"><span class="s5home"><span class="s5logo" aria-label="SEKTOR5"><svg class="s5word" viewBox="0 0 568 100" width="79.52" height="14" aria-hidden="true"><path d="M13,0 L70,0 L70,21 L21,21 L21,40 L57,40 L70,53 L70,87 L57,100 L0,100 L0,79 L49,79 L49,61 L13,61 L0,48 L0,13 ZM96,0 L104,0 L104,100 L96,100 L83,87 L83,13 ZM108,0 L153,0 L153,21 L108,21 ZM108,40 L145,40 L145,61 L108,61 ZM108,79 L153,79 L153,100 L108,100 ZM179,0 L187,0 L187,100 L179,100 L166,87 L166,13 ZM191,34 L209,0 L236,0 L215,50 L236,100 L209,100 L191,66 ZM262,0 L306,0 L319,13 L319,21 L249,21 L249,13 ZM273.5,25 L294.5,25 L294.5,100 L273.5,100 ZM365,0 L350,0 L332,18 L332,82 L350,100 L365,100 L365,79 L358,79 L353,74 L353,26 L358,21 L365,21 ZM369,0 L384,0 L402,18 L402,82 L384,100 L369,100 L369,79 L376,79 L381,74 L381,26 L376,21 L369,21 ZM428,0 L436,0 L436,100 L428,100 L415,87 L415,13 ZM440,0 L472,0 L485,13 L485,48 L473,60 L440,60 L440,39 L464,39 L464,21 L440,21 ZM440,64 L463,64 L485,100 L462,100 Z" fill="currentColor"/><path class="s5five" d="M498,0 L568,0 L568,21 L519,21 L519,40 L555,40 L568,53 L568,87 L555,100 L498,100 L498,79 L547,79 L547,61 L498,61 Z"/></svg></span></span> <nav class="pages" id="pages"><a data-port="8080" data-path="/">Decks</a><a class="here" data-port="8090" data-path="/">Lighting</a><a data-port="8100" data-path="/edit">Projection</a><a data-port="8110" data-path="/">Visuals</a><a data-port="8100" data-path="/stage.html">Stage</a></nav></h1>
<div class="wrap tabbed">

<div class="card span">
  <div class="row"><div id="scene" class="scene">—</div><div id="deck" class="dim"></div><span id="override" class="tag" hidden></span></div>
  <div id="title" class="dim" style="margin-top:6px"></div>
  <div class="row" style="margin-top:8px"><span id="count" class="count"></span><span id="pos" class="dim"></span></div>
  <div class="bar"><div id="prog"></div></div>
  <div class="beats" id="beats"><div class="one"></div><div></div><div></div><div></div></div>
  <canvas id="viz"></canvas>
</div>

<div class="card">
  <h2>Performance · hold</h2>
  <div class="grid">
    <button class="pad" data-hold="strobe">Strobe<small>hold · S</small></button>
    <button class="pad" data-hold="blinder">Blinder<small>hold · W</small></button>
    <button class="pad" data-hold="black_hold">Blackout<small>hold · B</small></button>
    <button class="pad" id="flash">Flash<small>tap · space</small></button>
  </div>
  <label>Strobe rate (locked to the beat)</label>
  <div class="seg" id="sdiv"><button data-v="1">1/4</button><button data-v="2">1/8</button><button data-v="4">1/16</button><button data-v="0">Free</button></div>
  <button id="autostrobe" style="width:100%;margin-top:8px" onclick="cmd('auto_strobe', !S.auto_strobe)" title="Strobe every LED at chosen moments of some high-energy drops (not all), capped at auto_strobe.max_hz flashes a second">Auto strobe <small id="autostrobeinfo"></small></button>
  <label>Waveform lights <span id="waveinfo" class="dim"></span></label>
  <div class="seg" id="wavel" title="The lights draw the track's own waveform: tubes, pyramid meters, the panel's scrolling waveform"><button data-v="auto">Auto</button><button data-v="on">On</button><button data-v="off">Off</button></div>
  <label>Mixer reactions <span id="mixinfo" class="dim"></span></label>
  <button id="mixreact" style="width:100%" onclick="cmd('mixer_react', !(S.mix && S.mix.react))" title="Lights react to the DJM: bass kill, fader level, Beat FX, filter">Mixer react</button>
  <label>Motion speed</label>
  <div class="seg" id="speed"><button data-v="0.5">½× Half</button><button data-v="1">1×</button><button data-v="2">2× Double</button></div>
  <div class="keymap" title="Keyboard shortcuts (a laptop next to the decks)">
    <span><kbd>Space</kbd> flash</span><span><kbd>S</kbd> strobe</span><span><kbd>W</kbd> blinder</span><span><kbd>B</kbd> blackout</span>
    <span><kbd>T</kbd> tap tempo</span><span><kbd>0</kbd>–<kbd>4</kbd> looks</span><span><kbd>D</kbd> drop now</span>
  </div>
</div>

<div class="card">
  <h2>Scenes · latch</h2>
  <div class="grid5">
    <button class="pad look" data-look="AUTO" style="--c:var(--good)">Auto<small>0</small></button>
    <button class="pad look" data-look="INTRO" style="--c:var(--na1a1a1, #a1a1a1)">Ambient<small>1</small></button>
    <button class="pad look" data-look="GROOVE" style="--c:var(--cyan)">Groove<small>2</small></button>
    <button class="pad look" data-look="BREAKDOWN" style="--c:var(--violet)">Break<small>3</small></button>
    <button class="pad look" data-look="DROP" style="--c:var(--pink)">Drop<small>4</small></button>
  </div>
  <h2 style="margin-top:14px">Drop control</h2>
  <div class="grid">
    <button class="big" onclick="cmd('drop_now')">Drop now<small>D</small></button>
    <button class="big" style="background:var(--warn);border-color:var(--warn)" onclick="cmd('build', +$('bbars').dataset.v)">Build <span id="bbl">4</span> bars</button>
  </div>
  <div class="seg" id="bbars" data-v="4" style="margin-top:8px"><button data-v="2">2</button><button data-v="4">4</button><button data-v="8">8</button><button data-v="16">16</button></div>
  <div class="grid" style="margin-top:10px">
    <button id="hold" onclick="cmd('hold')">Hold</button>
    <button onclick="cmd('clear')">Cancel build</button>
    <button onclick="cmd('skip_drop')">Skip next drop</button>
    <button onclick="cmd('mark_drop')">Mark drop here</button>
  </div>
</div>

<div class="card">
  <h2>Colour</h2>
  <div class="seg" id="pmode"><button data-v="auto">Auto · key</button><button data-v="lock">Lock</button><button data-v="cycle">Cycle</button><button data-v="visuals" title="The lights take the main colour of the projected picture">Visuals</button></div>
  <div class="swatches" id="swatches"></div>
</div>

<div class="card">
  <h2>Fixtures</h2>
  <div id="fixtures"></div>
  <label>Master intensity <span id="iv"></span></label>
  <input id="int" type="range" min="0" max="1" step="0.05" oninput="cmd('intensity',+this.value)">
  <button id="black" style="margin-top:12px;width:100%" onclick="cmd('mode', S.mode==='blackout'?'auto':'blackout')">Blackout (latch)</button>
</div>

<div class="card">
  <h2>Tap clock · used when no deck is playing</h2>
  <div class="tapbpm"><span id="tbpm">128.0</span> <span class="dim">BPM</span></div>
  <div class="grid4" style="margin-top:10px">
    <button onclick="cmd('tap_bpm', (S.tap_bpm||128) - 1)">−1</button>
    <button id="tap" style="grid-column:span 2" class="big">Tap<small>T</small></button>
    <button onclick="cmd('tap_bpm', (S.tap_bpm||128) + 1)">+1</button>
  </div>
  <button style="margin-top:8px;width:100%" onclick="cmd('tap_sync')">Sync · downbeat now</button>
</div>

<div class="card">
  <h2>Setup</h2>
  <label>Mode</label>
  <div class="seg" id="mode"><button data-v="auto">Auto</button><button data-v="manual">Manual</button></div>
  <label>Follow deck</label>
  <div class="seg" id="follow"><button data-v="0">Auto</button><button data-v="1">Deck 1</button><button data-v="2">Deck 2</button></div>
  <label>Output latency compensation <span id="lv"></span> ms</label>
  <input id="lead" type="range" min="0" max="200" step="5" oninput="cmd('lead_ms',+this.value)">
  <button style="margin-top:12px;width:100%" onclick="cmd('clear')">Reset all overrides</button>
</div>

</div>
<script>
const SCENE_NAME = { IDLE: "Waiting", INTRO: "Intro", GROOVE: "Groove", BUILD: "Building", HOLD: "Holding", PREDROP: "Here it comes", DROP: "Drop", BREAKDOWN: "Break", OUTRO: "Outro" };   // the show engine's scenes, as the pages show them
let S = {};
const $ = id => document.getElementById(id);
async function cmd(c, v) {
  try { await fetch('/api/cmd', {method:'POST', body: JSON.stringify({cmd:c, value:v})}); } catch (e) {}
}
const segs = (id, fn) => document.querySelectorAll(`#${id} button`).forEach(b => b.onclick = () => fn(b.dataset.v, b));
const segOn = (id, v) => document.querySelectorAll(`#${id} button`).forEach(b => b.classList.toggle('on', b.dataset.v === String(v)));
segs('mode', v => cmd('mode', v));
segs('follow', v => cmd('follow', +v));
segs('sdiv', v => cmd('strobe_div', +v));
segs('wavel', v => cmd('wave_lights', v));
segs('speed', v => cmd('speed', +v));
segs('pmode', v => cmd('palette', {mode: v}));
segs('bbars', v => { $('bbars').dataset.v = v; $('bbl').textContent = v; segOn('bbars', v); });
segOn('bbars', 4);
document.querySelectorAll('[data-look]').forEach(b => b.onclick = () => cmd('look', b.dataset.look));

// Hold pads: on while pressed (pointer capture keeps them on if the finger slides off).
function holdPad(el, name) {
  const set = on => { el.classList.toggle('held', on); cmd(name, on); };
  el.addEventListener('pointerdown', e => { el.setPointerCapture(e.pointerId); set(true); });
  for (const ev of ['pointerup', 'pointercancel', 'lostpointercapture']) el.addEventListener(ev, () => el.classList.contains('held') && set(false));
  return set;
}
const holds = {};
document.querySelectorAll('[data-hold]').forEach(b => holds[b.dataset.hold] = holdPad(b, b.dataset.hold));
const flash = () => { cmd('flash'); $('flash').classList.add('held'); setTimeout(() => $('flash').classList.remove('held'), 120); };
$('flash').addEventListener('pointerdown', flash);
const tap = () => { cmd('tap'); $('tap').classList.add('held'); setTimeout(() => $('tap').classList.remove('held'), 90); };
$('tap').addEventListener('pointerdown', tap);

// 12 hues around the wheel. No yellow: the lights skip it (looks.no_yellow), so it has no swatch.
const HUES = [0, 0.04, 0.09, 0.3, 0.45, 0.5, 0.55, 0.62, 0.72, 0.8, 0.9, 0.96];
$('swatches').innerHTML = HUES.map(h => `<button data-h="${h}" style="background:hsl(${h * 360},100%,55%)"></button>`).join('');
document.querySelectorAll('#swatches button').forEach(b => b.onclick = () => cmd('palette', {mode: 'lock', hue: +b.dataset.h}));

// Keyboard: space flash, S/W/B hold, T tap, 0-4 looks, D drop now.
const KEY_HOLD = { s: 'strobe', w: 'blinder', b: 'black_hold' };
const KEY_LOOK = { '0': 'AUTO', '1': 'INTRO', '2': 'GROOVE', '3': 'BREAKDOWN', '4': 'DROP' };
addEventListener('keydown', e => {
  if (e.repeat || e.metaKey || e.ctrlKey || e.target.tagName === 'INPUT') return;
  const k = e.key.toLowerCase();
  if (k === ' ') { e.preventDefault(); flash(); }
  else if (KEY_HOLD[k]) { holds[KEY_HOLD[k]](true); document.querySelector(`[data-hold=${KEY_HOLD[k]}]`).classList.add('held'); }
  else if (k === 't') tap();
  else if (k === 'd') cmd('drop_now');
  else if (KEY_LOOK[k]) cmd('look', KEY_LOOK[k]);
});
addEventListener('keyup', e => { const n = KEY_HOLD[e.key.toLowerCase()]; if (n) holds[n](false); });

// Fixture strips: mute toggle + level fader, built once per fixture list.
let fxNames = '';
function buildFixtures(ctl) {
  const names = Object.keys(ctl || {});
  if (names.join() === fxNames) return;
  fxNames = names.join();
  $('fixtures').innerHTML = names.map(n => `<div class="fx"><button data-fx="${n}">${n}</button>
    <input type="range" min="0" max="1" step="0.05" data-fxl="${n}"><span class="lv" data-fxv="${n}"></span></div>`).join('');
  document.querySelectorAll('[data-fx]').forEach(b => b.onclick = () => cmd('fixture', {name: b.dataset.fx, on: !S.fixture_ctl[b.dataset.fx].on}));
  document.querySelectorAll('[data-fxl]').forEach(i => i.oninput = () => cmd('fixture', {name: i.dataset.fxl, level: +i.value}));
}

// Live view of what each fixture is outputting.
function drawViz(preview) {
  const cv = $('viz'), dpr = devicePixelRatio || 1, names = Object.keys(preview || {});
  const rowH = innerWidth <= 760 ? 14 : 22, W = cv.clientWidth,   // phones: thinner rows, so the pinned status stays small
  H = Math.max(1, names.length) * rowH;
  if (cv.width !== Math.round(W * dpr) || cv.height !== Math.round(H * dpr)) { cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr); cv.style.height = H + 'px'; }
  const g = cv.getContext('2d'); g.setTransform(dpr, 0, 0, dpr, 0, 0); g.clearRect(0, 0, W, H);
  const lw = 64;
  names.forEach((n, i) => {
    const y = i * rowH, px = preview[n] || [];
    g.fillStyle = '#a1a1aa'; g.font = `600 ${rowH < 20 ? 10 : 11}px system-ui`; g.fillText(n, 0, y + rowH / 2 + 4);
    g.fillStyle = '#1f1f1f'; g.fillRect(lw, y + (rowH < 20 ? 2 : 3), W - lw, rowH - (rowH < 20 ? 4 : 6));
    const cw = (W - lw) / Math.max(1, px.length);
    px.forEach((c, k) => { g.fillStyle = c; g.fillRect(lw + k * cw, y + 3, Math.ceil(cw) - (px.length > 1 ? 1 : 0), rowH - 6); });
    if (!px.length) { g.fillStyle = '#6b6b6b'; g.fillText('idle / not streaming', lw + 8, y + 15); }
  });
}

async function poll() {
  try {
    S = await (await fetch('/api/state')).json();
    $('scene').textContent = SCENE_NAME[S.scene] || S.scene || '—'; $('scene').className = 'scene ' + S.scene;
    $('deck').textContent = S.free ? `tap clock · ${S.bpm.toFixed(1)} BPM` : S.live ? `deck ${S.live} · ${S.bpm ? S.bpm.toFixed(1) : '—'} BPM` : 'no deck playing';
    const ov = [S.look && `Scene ${S.look === 'INTRO' ? 'ambient' : (SCENE_NAME[S.look] || S.look).toLowerCase()}`, S.palette && S.palette.mode !== 'auto' && `Colour ${S.palette.mode}`,
                S.speed !== 1 && `${S.speed}×`, S.mode === 'blackout' && 'Blackout'].filter(Boolean).join(' · ');
    $('override').hidden = !ov; $('override').textContent = ov;
    $('title').textContent = S.title || '';
    $('count').textContent = S.beats_to_drop != null ? `Drop in ${Math.ceil(S.beats_to_drop)} beats` : (S.next_drop_bar || S.free || !S.live ? '' : 'no drop ahead');
    $('pos').textContent = (S.bar ? `bar ${S.bar} · beat ${S.bwb}` + (S.section ? ` · ${S.section}` : '') : '')
      + (S.drops && S.drops.length ? ` · drops: ${S.drops.map(d => d.bar + (d.manual ? '*' : '')).join(', ')}` : '') + (S.fps ? ` · ${S.fps} fps` : '')
      + (S.calibration ? ` · calibration: ${S.calibration.marks} marks, predictions ${S.calibration.median_delta_beats > 0 ? '+' : ''}${S.calibration.median_delta_beats} beats` : '');
    $('prog').style.width = ((S.scene === 'BUILD' || S.scene === 'HOLD') ? S.progress * 100 : S.scene === 'DROP' || S.scene === 'PREDROP' ? 100 : 0) + '%';
    document.querySelectorAll('#beats div').forEach((b, i) => b.classList.toggle('on', S.bwb === i + 1 && S.scene !== 'IDLE'));
    $('hold').classList.toggle('on', !!S.hold);
    $('black').classList.toggle('on', S.mode === 'blackout');
    segOn('mode', S.mode); segOn('follow', S.follow); segOn('sdiv', S.strobe_div); segOn('wavel', S.wave_lights);
    $('waveinfo').textContent = S.wave_now ? '· drawing it now' : S.wave_lights === 'auto' ? '· some phrases' : ''; segOn('speed', S.speed);
    const mx = S.mix || {};
    $('mixreact').classList.toggle('on', !!mx.react);
    $('autostrobe').classList.toggle('on', !!S.auto_strobe);
    $('autostrobeinfo').textContent = S.strobe_auto ? `· flashing ${S.strobe_auto.div}/beat` : S.auto_strobe ? '· picks some drops' : '· off';
    $('mixinfo').textContent = !mx.connected ? '· no mixer data' : [mx.bass_out && 'BASS OUT', mx.fx && 'FX ON',
      Math.abs(mx.filter || 0) > 0.05 && `FILTER ${mx.filter > 0 ? '+' : ''}${mx.filter}`, mx.level != null && `level ${Math.round(mx.level * 100)}%`].filter(Boolean).map(x => '· ' + x).join(' ');
    segOn('pmode', S.palette ? S.palette.mode : 'auto');
    document.querySelectorAll('#swatches button').forEach(b => b.classList.toggle('on', S.palette && S.palette.mode === 'lock' && Math.abs(+b.dataset.h - S.palette.hue) < 0.001));
    document.querySelectorAll('[data-look]').forEach(b => b.classList.toggle('on', (S.look || 'AUTO') === b.dataset.look));
    $('tbpm').textContent = (S.tap_bpm || 128).toFixed(1);
    buildFixtures(S.fixture_ctl);
    for (const [n, c] of Object.entries(S.fixture_ctl || {})) {
      document.querySelector(`[data-fx="${n}"]`).classList.toggle('on', c.on);
      const i = document.querySelector(`[data-fxl="${n}"]`);
      if (document.activeElement !== i) i.value = c.level;
      document.querySelector(`[data-fxv="${n}"]`).textContent = Math.round(c.level * 100) + '%';
    }
    drawViz(S.preview);
    if (document.activeElement !== $('int')) $('int').value = S.intensity;
    if (document.activeElement !== $('lead')) $('lead').value = S.lead_ms;
    $('iv').textContent = Math.round(S.intensity * 100) + '%'; $('lv').textContent = S.lead_ms;
  } catch (e) {}
  setTimeout(poll, 150);
}
poll();

// Section tabs under the live status (shared, /s5auth.js).
if (window.S5AUTH && S5AUTH.sectionTabs) {
  const wrap = document.querySelector(".wrap");
  S5AUTH.sectionTabs({ panel: wrap, mount: wrap.querySelector(".card.span"),
    items: () => [...wrap.querySelectorAll(":scope > .card:not(.span)")],
    title: c => c.querySelector("h2").textContent.split("·")[0].trim() });
}
</script>
</body>
