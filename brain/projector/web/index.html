<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<meta name="mobile-web-app-capable" content="yes">
<title>Sektor5 · Projector</title>

<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; cursor: none; }
  canvas { position: fixed; inset: 0; width: 100vw; height: 100vh; display: block; }
  #hud { position: fixed; left: 12px; bottom: 10px; font: 14px/1.4 ui-monospace, monospace; z-index: 3;
         color: #8f8; background: #000a; padding: 6px 10px; border-radius: 6px; white-space: pre; }
  #tap { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; z-index: 4;
         color: #fff8; font: 600 3vw system-ui, sans-serif; letter-spacing: .2em; text-align: center; }
  .hidden { display: none !important; }
</style>
</head>
<body>
<canvas id="gl"></canvas>
<canvas id="ov"></canvas>
<div id="hud" class="hidden"></div>
<div id="tap">TAP FOR FULLSCREEN<br><span style="font-size:1.4vw">set up from a phone: /edit</span></div>
<script src="render.js"></script>
<script>
// Projector output. Keys (or remote): T = test pattern, I = info HUD, F / Enter = fullscreen.
// URL flags: ?p=ID which projector this is (from the editor; none = the first), ?test=1 forces the
// test pattern, ?hud=1 shows the HUD.
const q = new URLSearchParams(location.search);
const hud = document.getElementById("hud"), tap = document.getElementById("tap");
if (q.get("hud") === "1") hud.classList.remove("hidden");
let localTest = q.get("test") === "1", online = false;
const PROJ = q.get("p") || "";                        // which projector (its surfaces and masks)
const BASE = location.pathname.startsWith("/projection") ? "/projection" : "";   // opened through the dashboard's address

const R = new MapRenderer(document.getElementById("gl"), document.getElementById("ov"));
connectEvents(R, { onStatus: ok => (online = ok), url: BASE + "/api/events" });
connectVisuals(R);   // generative sketch + live params for "gen" surfaces

// Render resolution: the projector's GPU is weak, so in auto mode (layout.render_scale = 0)
// the page renders below full resolution when the frame rate drops, and climbs back when
// there's headroom. The canvas is stretched to the screen either way.
let scale = 1, fps = 60, lastT = 0, good = 0, W = 1920, H = 1080;
const GPU = R.gpuName();
function applyScale() { R.resize(Math.max(64, Math.round(W * scale)), Math.max(36, Math.round(H * scale))); }
function report() {
  fetch(BASE + "/api/screen", { method: "POST", body: JSON.stringify({ p: PROJ, w: W, h: H, fps, scale, gpu: GPU }) }).catch(() => {});
}
function resize() {
  const d = devicePixelRatio || 1;
  W = Math.round(innerWidth * d); H = Math.round(innerHeight * d);
  applyScale(); report();
}
addEventListener("resize", resize); resize();
setInterval(() => {
  const want = R.layout ? R.layout.render_scale || 0 : 0;
  if (want > 0) scale = want;
  else if (fps < 45 && scale > 0.35) { scale = Math.max(0.35, scale * 0.8); good = 0; }
  else if (fps > 57 && scale < 1 && ++good >= 3) { scale = Math.min(1, scale * 1.15); good = 0; }
  applyScale(); report();
}, 2000);

function fullscreen() {
  document.documentElement.requestFullscreen?.().catch(() => {});
  tap.classList.add("hidden");
}
addEventListener("click", fullscreen);
addEventListener("keydown", e => {
  const k = e.key.toLowerCase();
  if (k === "t") localTest = !localTest;
  else if (k === "i") hud.classList.toggle("hidden");
  else if (k === "f" || k === "enter") fullscreen();
});
setTimeout(() => tap.classList.add("hidden"), 8000);

// The picture's main colour, for the lights' Visuals palette (showbrain), from the first projector only:
// a 32×18 copy of the frame just drawn (read in the same task, so the drawing buffer is still there), a
// hue histogram weighted by saturation × brightness (dark and grey pixels don't count) and the strongest
// hue. Too little colour on screen sends null: the lights hold the last colour, then after 5 s go back to the key.
const CS = document.createElement("canvas"); CS.width = 32; CS.height = 18;
const CX = CS.getContext("2d", { willReadFrequently: true });
const BINS = 36;
let colourT = 0;
function sampleColour(now) {
  if (now - colourT < 400) return;
  colourT = now;
  const first = R.layout && R.layout.projectors && R.layout.projectors[0];
  if (PROJ && first && first.id !== PROJ) return;
  CX.drawImage(R.cv, 0, 0, CS.width, CS.height);
  const px = CX.getImageData(0, 0, CS.width, CS.height).data;
  const hist = new Float32Array(BINS), sx = new Float32Array(BINS), sy = new Float32Array(BINS), ss = new Float32Array(BINS);
  let total = 0;
  for (let i = 0; i < px.length; i += 4) {
    const r = px[i] / 255, g = px[i + 1] / 255, b = px[i + 2] / 255;
    const mx = Math.max(r, g, b), mn = Math.min(r, g, b), c = mx - mn, s = mx ? c / mx : 0;
    if (mx < 0.12 || s < 0.25) continue;
    let h = mx === r ? ((g - b) / c) % 6 : mx === g ? (b - r) / c + 2 : (r - g) / c + 4;
    h = ((h / 6) % 1 + 1) % 1;
    const w = s * mx, k = Math.floor(h * BINS) % BINS, a = h * 2 * Math.PI;
    hist[k] += w; sx[k] += w * Math.cos(a); sy[k] += w * Math.sin(a); ss[k] += w * s; total += w;
  }
  let best = -1, bw = 0;
  for (let k = 0; k < BINS; k++) {
    const w = hist[(k + BINS - 1) % BINS] + 2 * hist[k] + hist[(k + 1) % BINS];
    if (w > bw) { bw = w; best = k; }
  }
  let body = { hue: null };
  if (best >= 0 && total > 0.012 * CS.width * CS.height) {   // thin coloured lines on black still count
    let x = 0, y = 0, w = 0, s = 0;
    for (const k of [best - 1, best, best + 1]) { const j = (k + BINS) % BINS; x += sx[j]; y += sy[j]; w += hist[j]; s += ss[j]; }
    body = { hue: (Math.atan2(y, x) / (2 * Math.PI) + 1) % 1, sat: s / w };
  }
  fetch(BASE + "/api/colour", { method: "POST", body: JSON.stringify(body) }).catch(() => {});
}

function frame(now) {
  if (lastT) fps += (1000 / Math.max(1, now - lastT) - fps) * 0.05;
  lastT = now;
  R.draw(now, { test: localTest, projector: PROJ });
  try { sampleColour(now); } catch (e) { /* never let the colour readout stop the picture */ }
  if (!hud.classList.contains("hidden")) {
    const s = R.clock.s, L = R.layout;
    hud.textContent = (online ? "" : "NO CONNECTION TO BRAIN\n")
      + (s ? `${s.scene}  ${s.bpm?.toFixed(1)} bpm  deck ${s.live}  bar ${s.bar}  ${s.section ?? ""}\n${s.title ?? ""}\n` : "show engine: no data\n")
      + (L ? `projector ${R.projectorId(PROJ)}: ${L.surfaces.filter(s => (s.projector || "main") === R.projectorId(PROJ)).length} of ${L.surfaces.length} surfaces, lead ${L.lead_ms} ms\n` : "")
      + `${fps.toFixed(0)} fps, rendering ${R.cv.width}×${R.cv.height} (${Math.round(scale * 100)}%) of ${W}×${H}\n${GPU}`;
  }
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
</html>
